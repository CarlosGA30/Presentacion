<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actividades</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- NAVBAR -->
  <header id="global-navbar" class="w-full h-16 bg-white shadow-md flex items-center justify-between px-6 fixed top-0 left-0 z-50 border-b border-gray-200">
    <div class="flex items-center gap-3">
      <div class="bg-blue-600 text-white p-2 rounded-lg">
        <i class="bi bi-boxes text-xl"></i>
      </div>
      <h1 class="font-bold text-gray-800 text-lg">System word</h1>
    </div>
    <nav class="flex items-center gap-1" id="navbar-menu"></nav>
  </header>

  <div class="flex min-h-screen">

    <!-- CONTENIDO PRINCIPAL -->
    <main class="p-2 w-full">

      <div class="max-w-5xl mx-auto">

        <h1 class="text-3xl font-bold mb-8 flex items-center gap-3">
          <i class="bi bi-journal-check text-blue-600"></i>
          Actividades Prácticas
        </h1>
        <!-- CARRUSEL -->
        <div class="relative">

          <button id="prevBtn"
            class="absolute left-0 top-1/2 -translate-y-1/2 bg-white shadow p-2 rounded-full z-30">
            <i class="bi bi-chevron-left"></i>
          </button>

          <div id="carousel" class="relative h-[260px] flex items-center justify-center overflow-hidden"></div>

          <button id="nextBtn"
            class="absolute right-0 top-1/2 -translate-y-1/2 bg-white shadow p-2 rounded-full z-30">
            <i class="bi bi-chevron-right"></i>
          </button>

        </div>
      </div>
              <div class="mt-10 bg-white">
          <p class="mt-4 text-sm font-bold text-rose-400 italic 
           bg-gradient-to-r from-white via-blue-100 to-white shadow-lg
           p-5 rounded-lg shadow text-center">
    Las actividades se reiniciarán al recargar la página.
</p>
        </div>
        <!-- Busca esta sección en tu HTML y reemplaza el iframe -->
        <div id="actividadDetalle" class="mt-10 bg-white p-1 rounded-xl shadow-md border hidden sticky top-20 z-20">
        <h2 id="actividadTitulo" class="text-2xl font-bold mb-4 border-b pb-2 text-blue-600">Actividad</h2>
        <!-- Reemplazamos iframe por un div contenedor -->
        <div id="actividadContenido" class="w-full min-h-[400px]"></div>
        </div>
    </main>

  </div>

  <!-- Script del sidebar -->
  <script type="module">
    import { renderSidebar } from './js/sidebar.js';
    document.addEventListener('DOMContentLoaded', renderSidebar);
  </script>

  <!-- Script principal -->
  <script type="module" src="./js/actividades/main.js"></script>

</body>
</html>
